<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida ❤️</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ecf2f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
        }
        .contenedor-botones {
            position: relative;
            width: 300px;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #btnSi {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #btnSi:hover {
            transform: scale(1.1);
        }
        #btnNo {
            background-color: #30363d;
            color: #8b949e;
            position: absolute;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

    <h1 id="texto">¿Quieres ser mi Valentín por siempre? ❤️</h1>

    <div class="contenedor-botones">
        <button id="btnSi" onclick="aceptar()">SÍ</button>
        <button id="btnNo" onmouseover="esquivar()" onclick="esquivar()">NO</button>
    </div>

    <script>
        function esquivar() {
            const btnNo = document.getElementById('btnNo');
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            
            btnNo.style.position = 'absolute';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        function aceptar() {
            document.getElementById('texto').innerHTML = "¡SABÍA QUE DIRÍAS QUE SÍ! ¡TE AMO! 😍❤️";
            document.querySelector('.contenedor-botones').style.display = 'none';
            setInterval(crearCorazon, 150);
        }

        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.innerHTML = '❤️';
            corazon.style.position = 'absolute';
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.top = '-20px';
            corazon.style.fontSize = Math.random() * 20 + 20 + 'px';
            corazon.style.animation = 'caer 3s linear forwards';
            corazon.style.opacity = Math.random();
            
            document.body.appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 3000);
        }
    </script>

    <style>
        @keyframes caer {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</body>
</html>
